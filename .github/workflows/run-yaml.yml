# Runs run.yaml exactly as the template instructs (every command, as written, in order, from a
# fresh checkout) on Python 3.10 to 3.14, in two modes:
#   replay  no CLAUDE_KEY and no npm (so run.yaml's CLI install fails softly): recorded LLM answers.
#           Runs on every push.
#   live    CLAUDE_KEY set; run.yaml installs the claude CLI itself. Manual trigger only
#           (workflow_dispatch), so pushes never spend the key.
# Needs no Slack, no GitHub write token and nothing from the python-dotenv fork.

name: run.yaml check

on:
  push:
    branches: [main]
    paths: ["run.yaml", "requirements.txt", "src/**", ".github/workflows/run-yaml.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-yaml:
    name: run.yaml (py${{ matrix.python }}, ${{ matrix.mode }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        mode: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["replay","live"]' || '["replay"]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Replay mode = a machine without Node/npm or a key
        if: matrix.mode == 'replay'
        run: |
          mkdir -p "$RUNNER_TEMP/no-node"
          for t in npm npx node claude; do
            printf '#!/bin/sh\necho "%s: command not found" >&2\nexit 127\n' "$t" > "$RUNNER_TEMP/no-node/$t"
            chmod +x "$RUNNER_TEMP/no-node/$t"
          done
          echo "$RUNNER_TEMP/no-node" >> "$GITHUB_PATH"
      - name: Run every run.yaml command exactly as written
        env:
          CLAUDE_KEY: ${{ matrix.mode == 'live' && secrets.CLAUDE_KEY || '' }}
          MODE: ${{ matrix.mode }}
        run: |
          set -o pipefail
          fail() { echo "::error::$1"; exit 1; }
          for section in setup_commands run_commands test_commands; do
            mapfile -t cmds < <(yq -r ".${section}[]" run.yaml)
            for cmd in "${cmds[@]}"; do
              echo "::group::[$section] $cmd"
              bash -c "$cmd" 2>&1 | tee -a all.log; rc=${PIPESTATUS[0]}
              echo "::endgroup::"
              [ "$rc" = 0 ] || fail "run.yaml command failed (exit $rc): $cmd"
            done
          done
          # The mode must be the one we intended, not a silent fallback.
          grep -q "mode       : $MODE" all.log || fail "expected LLM mode '$MODE' (see doctor output)"
          if [ "$MODE" = live ]; then grep -q "LLM: live" out/demo/report.md || fail "fix did not run live"; fi
          if [ "$MODE" = replay ]; then ! grep -q "no recording" all.log || fail "a replay recording is missing"; fi
          grep -q "ALL SUITES PASSED" all.log || fail "tests did not all pass"
          echo "run.yaml passed: python ${{ matrix.python }}, mode $MODE" >> "$GITHUB_STEP_SUMMARY"
